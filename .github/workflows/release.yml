name: Release

# Push a tag like v0.1.0 (matching package.json) to build and publish a release.
#
# Two jobs, so that no third-party code (npm packages, Rust crates, the build
# tools) ever runs while a token that can publish or sign is available:
#   build   - read-only: tests and builds digibyte-vanity-address.html
#   publish - only checks the file's SHA-256, signs the build provenance
#             attestation and creates the release. It runs no project code.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node build.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/digibyte-vanity-address.html
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Check the file against SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/digibyte-vanity-address.html
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/digibyte-vanity-address.html dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "DigiByte Vanity Address $GITHUB_REF_NAME" \
            --notes "Download \`digibyte-vanity-address.html\`, check it against \`SHA256SUMS\`, and open it in your browser (for the most safety: offline, in a private window). Check it was built here from this code with \`gh attestation verify digibyte-vanity-address.html --repo $GITHUB_REPOSITORY\`. SHA-256: \`$(cut -d' ' -f1 dist/SHA256SUMS)\`"
