name: Release

# Push a tag like v0.1.0 (matching package.json) to build and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node build.mjs
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/vanity.html
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/vanity.html dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "DigiByte Vanity Address $GITHUB_REF_NAME" \
            --notes "Download \`vanity.html\`, check it against \`SHA256SUMS\`, and open it in your browser (ideally offline). SHA-256: \`$(cut -d' ' -f1 dist/SHA256SUMS)\`"
